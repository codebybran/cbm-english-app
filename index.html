<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chunk-Based Mastery · Inglés por bloques</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <span class="mark">CBM</span>
        <h1>Chunk-Based Mastery</h1>
        <p id="levelTitle">Cargando…</p>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" class="tab active" data-view="study">Estudio</button>
        <button role="tab" class="tab" data-view="listening">Escucha</button>
        <button role="tab" class="tab" data-view="dictation">Dictado</button>
        <button role="tab" class="tab" data-view="speaking">Conversación</button>
        <button role="tab" class="tab" data-view="simulation">Simulación</button>
      </nav>
      <div class="group">
        <span class="lbl">Subnivel</span>
        <div class="seg" role="group" aria-label="Subnivel">
          <button class="lvl-btn active" data-level="1A">1A</button>
          <button class="lvl-btn" data-level="1B">1B</button>
        </div>
      </div>
      <div class="group">
        <span class="lbl">Velocidad del audio</span>
        <div class="seg" role="group" aria-label="Velocidad de audio">
          <button class="speed-btn" data-rate="0.8">0.8x lenta</button>
          <button class="speed-btn active" data-rate="1">1.0x nativa</button>
          <button class="speed-btn" data-rate="1.2">1.2x rápida</button>
        </div>
      </div>
      <button id="themeBtn" class="btn" type="button">Modo oscuro</button>
    </aside>
    <main>
      <section id="study" class="view active"></section>
      <section id="listening" class="view"></section>
      <section id="dictation" class="view"></section>
      <section id="speaking" class="view"></section>
      <section id="simulation" class="view"></section>
    </main>
  </div>
  <p id="voiceWarn" class="warn" hidden>Tu navegador no tiene voz en inglés (en-US). Prueba con Chrome o Edge.</p>
  <script src="js/app.js"></script>
  <script src="js/dictation.js"></script>
  <script src="js/simulation.js"></script>
</body>
</html>
