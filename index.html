*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.layout{display:flex;min-height:100vh}
aside{width:270px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}

.btn-mini{font-size:12px;padding:3px 8px}
.btn-del{color:#b3261e}
main{flex:1;min-width:0;padding:24px 16px 60px}

.page h3{font-size:1.2em;margin-top:1.6em}
.num{color:var(--accent);margin-right:.4em}
.ed{outline:none;min-height:1.6em;white-space:pre-wrap;border-radius:3px;padding:2px 4px;margin:0 -4px}
.ed:hover{background:rgba(122,31,43,.05)}
.ed:focus{background:rgba(122,31,43,.09)}
.ed:empty:before{content:attr(data-ph);color:var(--muted);font-style:italic;pointer-events:none}

.toc a span.pg{order:2;color:var(--muted)}

.row{display:flex;gap:8px;align-items:baseline;justify-content:space-between}

.actions{display:flex;gap:6px;flex:none}
.ref{padding-left:2em;text-indent:-2em;margin-bottom:.6em}

.hint{font:12px/1.4 system-ui;color:var(--muted);margin:.4em 0 0}
.addbar{margin-top:14px}
.ref-meta{font:12px/1.4 system-ui;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0 0 1em}
@media(max-width:860px){.layout{display:block}aside{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line)}.page{padding:32px 22px}.cover{min-height:0;gap:2em}}
@media print{aside,.actions,.addbar,.hint,.ref-meta{display:none!important}body,main{background:#fff;padding:0}.page{box-shadow:none;border:0;margin:0;page-break-after:always;max-width:none}.ed:empty:before{content:""}}

    { titulo: 'Enfoque de investigación', contenido: `Diseño de un sistema de apoyo a la investigación jurídica mediante la integración y evaluación de herramientas de inteligencia artificial.` },
    { titulo: 'Planteamiento del problema', contenido: `La incorporación de herramientas de inteligencia artificial en la educación superior está generando nuevas posibilidades para apoyar procesos de investigación, búsqueda, organización y análisis de información. En América Latina y el Caribe, el uso de IA en investigación ya está presente en una proporción significativa de las instituciones de educación superior, mientras que los mecanismos institucionales de gobernanza y evaluación presentan un desarrollo menor.

En el ámbito jurídico, la utilización de estas tecnologías plantea exigencias particulares debido a la necesidad de identificar, consultar y contrastar fuentes normativas, jurisprudenciales y doctrinales. En Colombia, la Corte Constitucional y el Consejo Superior de la Judicatura han reconocido la posibilidad de utilizar herramientas de IA como apoyo, pero han resaltado la importancia de la supervisión humana, la verificación de los resultados y el contraste con fuentes confiables.

En este contexto, se identifica la necesidad de estudiar cómo puede diseñarse un sistema de apoyo a la investigación jurídica que integre diferentes herramientas de inteligencia artificial para facilitar actividades como la búsqueda, organización y análisis de información, incorporando mecanismos que permitan identificar las fuentes utilizadas, relacionarlas con las afirmaciones obtenidas y facilitar su posterior verificación por parte del investigador.

El problema de investigación se centra, por tanto, en cómo aprovechar las capacidades de diferentes herramientas de inteligencia artificial dentro de un proceso estructurado de investigación jurídica, sin sustituir el análisis, la toma de decisiones ni la responsabilidad del investigador sobre las fuentes y resultados utilizados.` },
    { titulo: 'Pregunta de investigación', contenido: `¿Cómo puede diseñarse un sistema de apoyo a la investigación jurídica que integre diferentes herramientas de inteligencia artificial para facilitar la búsqueda, organización, análisis y verificación de información jurídica, manteniendo la revisión humana de las fuentes y los resultados?` },
    { titulo: 'Objetivo general', contenido: `Diseñar un sistema de apoyo a la investigación jurídica que integre diferentes herramientas de inteligencia artificial para facilitar la búsqueda, organización, análisis y verificación de información jurídica, manteniendo la revisión humana de las fuentes y los resultados.` },
    { titulo: 'Objetivos específicos', contenido: `Identificar las necesidades, oportunidades y desafíos relacionados con el uso de herramientas de inteligencia artificial en los procesos de investigación jurídica universitaria, con énfasis en la búsqueda, organización, análisis y verificación de información jurídica.

    { titulo: 'Justificación', contenido: `La incorporación de herramientas de inteligencia artificial generativa en los procesos de educación superior y de investigación plantea nuevas posibilidades para apoyar actividades relacionadas con la búsqueda, organización, exploración y análisis de información. Sin embargo, su utilización también requiere criterios que permitan determinar cuándo y cómo emplear estas herramientas, así como mecanismos de validación y supervisión humana. UNESCO ha señalado la importancia de mantener la agencia humana, desarrollar capacidades para el uso adecuado de estas tecnologías y evaluar sus resultados dentro de los procesos educativos y de investigación.

En el campo del Derecho, esta situación adquiere particular relevancia debido a la naturaleza de las fuentes utilizadas en la investigación jurídica. El investigador debe localizar, consultar, analizar y relacionar normas, decisiones judiciales, doctrina y demás fuentes pertinentes, por lo que el uso de herramientas de inteligencia artificial no puede entenderse simplemente como la generación automática de respuestas. Es necesario que los resultados obtenidos puedan ser contrastados con las fuentes correspondientes y que el investigador conserve la responsabilidad sobre las decisiones y conclusiones que incorpore a su trabajo.

Desde una perspectiva académica, esta investigación resulta pertinente porque busca estudiar una forma estructurada de integrar diferentes herramientas de inteligencia artificial dentro del proceso de investigación jurídica, en lugar de limitar su utilización a la generación de textos. La propuesta pretende organizar las herramientas según las necesidades de las diferentes etapas de investigación y establecer mecanismos que permitan identificar, organizar, relacionar y verificar las fuentes utilizadas.

Desde una perspectiva práctica, el diseño de un sistema de apoyo podría proporcionar una estructura que facilite al estudiante de Derecho el desarrollo ordenado de sus procesos investigativos, ayudándolo a pasar de la identificación de un tema a la búsqueda de fuentes, organización de evidencias, análisis y construcción del documento final. El sistema no tendría como finalidad sustituir el criterio jurídico del investigador, sino apoyar determinadas actividades y mantener la revisión humana como parte fundamental del proceso.

Finalmente, la investigación resulta pertinente porque permite relacionar el desarrollo tecnológico con las exigencias propias de la investigación jurídica, proponiendo un modelo que pueda ser estudiado, evaluado y posteriormente ampliado. De esta manera, el proyecto busca aportar tanto al análisis académico del uso de inteligencia artificial en investigación como al diseño de una propuesta tecnológica orientada específicamente al ámbito jurídico.` }

  /* Capítulo 2: su título aún no ha sido suministrado. */
  { titulo: '', contenido: '', subs: [
    { titulo: 'Investigación jurídica', contenido: `La investigación jurídica constituye una actividad orientada al estudio sistemático de problemas relacionados con el Derecho, mediante procesos de búsqueda, análisis, interpretación y organización de información jurídica. Su desarrollo requiere delimitar un objeto de estudio, formular preguntas y seleccionar métodos y técnicas coherentes con las características del problema investigado. La investigación en Derecho comprende distintas formas metodológicas y puede incorporar dimensiones teóricas, prácticas e interdisciplinarias, de acuerdo con las características y propósitos de cada investigación. (Barreto Rozo & Lozano Rodríguez, 2021).

El objeto de la investigación jurídica puede abordarse desde diferentes perspectivas metodológicas. Entre ellas se encuentra la investigación documental o bibliográfica, que ocupa un lugar tradicional dentro de la investigación jurídica. Botero Bernal (2003) señala que este modelo parte de la utilización y análisis de documentos y bibliografía, buscando que el investigador pueda relacionar información y desarrollar procesos de análisis crítico sobre el fenómeno estudiado.

La investigación documental adquiere especial importancia en el campo jurídico debido al papel que desempeñan los libros, documentos y demás materiales utilizados para transmitir y consultar conocimiento. En este tipo de investigación, la revisión de la literatura relacionada con el problema estudiado constituye una actividad necesaria para organizar y analizar la información disponible (Botero Bernal, 2003).

En consecuencia, la investigación jurídica requiere un proceso organizado en el que el investigador delimite el problema, determine las fuentes pertinentes, seleccione métodos adecuados, analice la información obtenida y construya sus conclusiones a partir de los elementos examinados. Las metodologías de investigación jurídica pueden responder a diferentes formas de comprender y desarrollar la investigación en Derecho, por lo que su selección debe guardar relación con el objeto y los propósitos del estudio (Barreto Rozo & Lozano Rodríguez, 2021).

Para la presente investigación, esta concepción resulta especialmente relevante porque el sistema propuesto pretende apoyar diferentes actividades que hacen parte del proceso investigativo jurídico. Por ello, antes de estudiar las herramientas de inteligencia artificial, es necesario comprender las características de la investigación jurídica y las necesidades de información que surgen durante su desarrollo. Esta base permitirá posteriormente analizar cómo diferentes herramientas pueden integrarse al proceso sin sustituir el análisis y la revisión del investigador.` },
    { titulo: 'Fuentes de información jurídica', contenido: `En los procesos de investigación jurídica, las fuentes de información constituyen un elemento fundamental para obtener y sistematizar información. Agudelo Giraldo (2025) explica que las fuentes de investigación, también denominadas fuentes de información, se relacionan con los recursos utilizados durante el proceso investigativo y que su naturaleza y clasificación pueden variar de acuerdo con el tipo de investigación jurídica desarrollada.

En el campo de la investigación jurídica, las fuentes pueden organizarse de acuerdo con su grado de originalidad en fuentes primarias, secundarias y terciarias. Esta clasificación no funciona de manera idéntica para todas las formas de investigación jurídica, debido a que el tipo de fuente utilizada depende del propósito y de la forma de investigación desarrollada. Agudelo Giraldo (2025) muestra que, según el tipo de investigación, las fuentes pueden corresponder a fuentes del Derecho, fuentes personales o fuentes de referencia y bibliográficas.

Dentro de las fuentes empleadas habitualmente en la investigación jurídica se encuentran la legislación, la jurisprudencia y la doctrina. La legislación y la jurisprudencia pueden utilizarse para la formulación de respuestas frente a problemas jurídicos, mientras que la doctrina cumple una función relevante en la construcción de marcos teóricos y en la elaboración de conceptos y principios jurídicos (Agudelo Giraldo, 2025).

La clasificación de las fuentes también puede comprender información obtenida directamente por el investigador, documentos que contienen información previamente recopilada y materiales que permiten localizar o sintetizar información procedente de otras fuentes. En este sentido, Agudelo Giraldo (2025) diferencia entre fuentes primarias, secundarias y terciarias y señala que su utilización debe relacionarse con las características de la investigación que se desarrolla.

En la investigación jurídica orientada al estudio del Derecho como disciplina práctica, las fuentes de información presentan una relación particularmente estrecha con las fuentes del Derecho. Agudelo Giraldo (2025) explica que, en este tipo de investigación, las fuentes primarias pueden encontrarse en la legislación y en determinadas decisiones judiciales, mientras que otras fuentes cumplen funciones de interpretación o análisis. Por esta razón, la selección de las fuentes debe estar relacionada con el problema jurídico que se pretende abordar.

La selección de fuentes no debe realizarse únicamente a partir de una clasificación general de los documentos disponibles. Agudelo Giraldo (2025) sostiene que es necesario delimitar previamente el propósito y el tipo de investigación que se pretende desarrollar, puesto que las fuentes pueden variar según las características del estudio. De esta manera, una adecuada selección de fuentes requiere considerar qué información se necesita y cuál es la función que cada fuente cumple dentro de la investigación.

En este contexto, las fuentes de información jurídica no se limitan exclusivamente a obras de referencia. El artículo señala que las fuentes primarias no necesariamente corresponden a este tipo de materiales y que, dependiendo de la investigación, también pueden utilizarse fuentes personales, documentales y bibliográficas. Esto permite comprender que la naturaleza de una fuente depende de la función que desempeña dentro del proceso investigativo y del tipo de problema que se pretende estudiar (Agudelo Giraldo, 2025).

Para la presente investigación, esta clasificación resulta relevante porque el sistema propuesto deberá permitir trabajar con diferentes tipos de información jurídica de acuerdo con las necesidades de cada etapa del proceso investigativo. La legislación, la jurisprudencia y la doctrina constituyen fuentes básicas que deberán ser identificadas y organizadas, mientras que la selección de otras fuentes dependerá del propósito específico de la investigación. En consecuencia, el sistema de apoyo deberá considerar no solamente la localización de información, sino también la identificación de la fuente y su función dentro del proceso de investigación jurídica.` },
    { titulo: 'Inteligencia artificial aplicada a la investigación', contenido: `La incorporación de herramientas de inteligencia artificial generativa en los procesos de investigación ha abierto posibilidades para apoyar diferentes actividades relacionadas con el tratamiento y la exploración de información. UNESCO señala que la inteligencia artificial generativa puede automatizar el tratamiento de información y la presentación de resultados, además de proporcionar productos de conocimiento semiacabados que pueden ser utilizados por docentes, estudiantes e investigadores. Desde esta perspectiva, estas herramientas pueden incorporarse como recursos de apoyo dentro de los procesos investigativos, particularmente en actividades que requieren trabajar con grandes cantidades de información (Miao & Holmes, 2023, p. 7).

En relación con las actividades propias de la investigación, UNESCO señala que los modelos de inteligencia artificial generativa han demostrado potencial para ampliar los puntos de vista sobre los esquemas de investigación y enriquecer la exploración de datos y las revisiones bibliográficas. Estas posibilidades permiten considerar el uso de herramientas de inteligencia artificial como apoyo para determinadas actividades del proceso investigativo, especialmente aquellas relacionadas con la exploración y organización de información. No obstante, la misma fuente señala que todavía se requiere investigación para determinar el alcance de los problemas de investigación y los resultados en los que estas herramientas pueden utilizarse, así como para demostrar su eficacia y precisión (Miao & Holmes, 2023).

El uso de inteligencia artificial en investigación también requiere establecer condiciones que permitan valorar sus resultados y determinar la forma adecuada de interacción entre los investigadores y las herramientas. UNESCO plantea que los investigadores deben priorizar la intervención humana y que el proceso de utilización de estas herramientas debe permanecer bajo el control de los investigadores humanos. Asimismo, señala la importancia de mantener la interacción humana con la inteligencia artificial, el pensamiento de orden superior y la responsabilidad humana respecto de decisiones relacionadas con la veracidad de los contenidos generados por IA y con las estrategias de investigación (Miao & Holmes, 2023).

En este sentido, la utilización de inteligencia artificial en la investigación no se plantea únicamente como una cuestión de incorporar herramientas tecnológicas al proceso investigativo, sino como un proceso que requiere definir sus usos, evaluar sus resultados y mantener la participación del investigador. La guía de UNESCO también plantea la necesidad de realizar procesos de ensayo y evaluación para analizar la efectividad y el impacto a largo plazo de los diferentes usos de la IAGen en educación e investigación. Por tanto, la incorporación de estas herramientas debe considerar tanto sus posibilidades de apoyo como las condiciones necesarias para garantizar un uso responsable y adecuado dentro del proceso investigativo (Miao & Holmes, 2023).

Para la presente investigación, estos planteamientos permiten establecer una base para analizar la integración de diferentes herramientas de inteligencia artificial dentro de un proceso de investigación jurídica. Las posibilidades identificadas para la exploración de información, el análisis de datos y las revisiones bibliográficas pueden relacionarse con algunas de las actividades que desarrolla el investigador jurídico. Sin embargo, su incorporación al sistema propuesto deberá mantener la intervención y responsabilidad del investigador, de manera que las herramientas funcionen como apoyo para el proceso de búsqueda, organización, análisis y verificación de información, sin sustituir la revisión humana de las fuentes y de los resultados.` }

const letra = i => String.fromCharCode(65 + i);

/* Campo editable: tag, ruta en el modelo, texto guía */
const ed = (path, ph, cls = '', tag = 'div') =>
  `<${tag} class="ed ${cls}" contenteditable="true" data-k="${path}" data-ph="${esc(ph)}">${esc(get(path))}</${tag}>`;

/* =====================================================================
   TABLA DE CONTENIDO (se genera sola a partir de la estructura)
   ===================================================================== */
function tocItems() {
  const t = [];
  t.push({ id: 'resumen', txt: 'Resumen', l: 1 });
  t.push({ id: 'palabras', txt: 'Palabras clave', l: 1 });
  t.push({ id: 'intro', txt: 'Introducción', l: 1 });
  S.capitulos.forEach((c, i) => {
    t.push({ id: `cap-${i}`, txt: `Capítulo ${i + 1}. ${c.titulo || '(sin título)'}`, l: 1 });
    c.subs.forEach((s, j) => t.push({ id: `sub-${i}-${j}`, txt: `${i + 1}.${j + 1} ${s.titulo || '(sin título)'}`, l: 2 }));
  });
  t.push({ id: 'refs', txt: 'Referencias bibliográficas', l: 1 });
  t.push({ id: 'anexos', txt: 'Anexos', l: 1 });
  S.anexos.forEach((a, i) => t.push({ id: `anx-${i}`, txt: `Anexo ${letra(i)}. ${a.titulo || '(sin título)'}`, l: 2 }));
  return t;
}
function refreshToc() {
  const items = tocItems();
  $('#nav').innerHTML = items.map(x => `<a class="l${x.l}" href="#${x.id}">${esc(x.txt)}</a>`).join('');
  const box = $('#toc'); if (box) box.innerHTML = items.map(x =>
    `<a class="l${x.l}" href="#${x.id}"><span>${esc(x.txt)}</span><span class="pg">–</span></a>`).join('');
}

/* =====================================================================
   RENDER (una función por sección: fácil de modificar o ampliar)
   ===================================================================== */
const secPortada = () => `
<section class="page cover" id="portada">
  <div>
    ${ed('portada.institucion', 'Institución', 'inst')}
    ${ed('portada.programa', 'Programa académico')}
  </div>
  ${ed('portada.titulo', 'Título de la monografía', 'title')}
  <dl>
    <div><span class="label">Autor</span>${ed('portada.autor', 'Nombre del autor')}</div>
    <div><span class="label">Director / Asesor</span>${ed('portada.director', 'Nombre del director')}</div>
    <div>${ed('portada.ciudad', 'Ciudad')}${ed('portada.fecha', 'Fecha')}</div>
  </dl>
</section>`;

const secSimple = (id, titulo, path, ph, extra = '') => `
<section class="page" id="${id}"><h2>${titulo}</h2>${ed(path, ph)}${extra}</section>`;

const secToc = () => `
<section class="page" id="toc-sec"><h2>Tabla de contenido</h2>
  <div class="toc" id="toc"></div>
  <p class="hint">Se genera automáticamente. Los números de página se asignarán en la exportación a Word.</p>
</section>`;

const secCapitulos = () => S.capitulos.map((c, i) => `
<section class="page" id="cap-${i}">
  <div class="row"><h2><span class="num">Capítulo ${i + 1}.</span>${ed(`capitulos.${i}.titulo`, 'Título del capítulo', '', 'span')}</h2>
    <div class="actions"><button class="btn-mini" data-act="add-sub" data-i="${i}">+ Subcapítulo</button>
    <button class="btn-mini btn-del" data-act="del-cap" data-i="${i}">Eliminar</button></div></div>
  ${ed(`capitulos.${i}.contenido`, 'Contenido introductorio del capítulo')}
  ${c.subs.map((s, j) => `
  <div id="sub-${i}-${j}">
    <div class="row"><h3><span class="num">${i + 1}.${j + 1}</span>${ed(`capitulos.${i}.subs.${j}.titulo`, 'Título del subcapítulo', '', 'span')}</h3>
    <div class="actions"><button class="btn-mini btn-del" data-act="del-sub" data-i="${i}" data-j="${j}">Eliminar</button></div></div>
    ${ed(`capitulos.${i}.subs.${j}.contenido`, 'Contenido del subcapítulo')}
  </div>`).join('')}
</section>`).join('') +
`<div class="addbar page" style="padding:16px 24px;text-align:center"><button data-act="add-cap">+ Agregar capítulo</button></div>`;

/* Campos del registro interno. Los 3 básicos siempre se muestran; los demás solo si la fuente los tiene. */
const META = [['categoria','Categoría'],['tipo','Tipo'],['autor','Autor'],['autores','Autores'],['anio','Año'],['titulo','Título'],['revista','Revista'],['institucion','Institución'],['volumen','Volumen'],['numero','Número'],['paginas','Páginas'],['uso','Uso'],['citaTexto','Cita en el texto']];
const CORE = ['categoria','tipo','uso'];
const metaRows = (r, i) => META.filter(([k]) => CORE.includes(k) || r[k] !== undefined)
  .map(([k, l]) => `<div><span class="label">${l}</span>${ed(`referencias.${i}.${k}`, l)}</div>`).join('');

const secRefs = () => `
<section class="page" id="refs"><h2>Referencias bibliográficas</h2>
  ${S.referencias.map((r, i) => `<div class="ref-row"><div style="flex:1"><div class="ref">${ed(`referencias.${i}.cita`, 'Referencia bibliográfica')}</div>
      <div class="ref-meta"><span class="label">Registro interno (no se imprime)</span>
        ${metaRows(r, i)}</div></div>
    <button class="btn-mini btn-del" data-act="del-ref" data-i="${i}">×</button></div>`).join('')}
  <button class="btn-mini" data-act="add-ref">+ Agregar referencia</button>
  <p class="hint">Sangría francesa lista (clase .ref). El formato de citación se definirá después.</p>
</section>`;

const secAnexos = () => `
<section class="page" id="anexos"><h2>Anexos</h2>
  ${S.anexos.map((a, i) => `<div id="anx-${i}">
    <div class="row"><h3><span class="num">Anexo ${letra(i)}.</span>${ed(`anexos.${i}.titulo`, 'Título del anexo', '', 'span')}</h3>
    <div class="actions"><button class="btn-mini btn-del" data-act="del-anx" data-i="${i}">Eliminar</button></div></div>
    ${ed(`anexos.${i}.contenido`, 'Contenido del anexo')}</div>`).join('')}
  <button class="btn-mini" data-act="add-anx">+ Agregar anexo</button>
</section>`;

function render() {
  $('#app').innerHTML = secPortada()
    + secSimple('resumen', 'Resumen', 'resumen', 'Escriba aquí el resumen…')
    + secSimple('palabras', 'Palabras clave', 'palabrasClave', 'Palabra 1; palabra 2; palabra 3…')
    + secToc()
    + secSimple('intro', 'Introducción', 'introduccion', 'Escriba aquí la introducción…')
    + secCapitulos() + secRefs() + secAnexos();
  refreshToc();
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
let t;
document.addEventListener('input', e => {
  const el = e.target.closest('[data-k]'); if (!el) return;
  set(el.dataset.k, el.innerText.replace(/\n$/, '')); save();
  clearTimeout(t); t = setTimeout(refreshToc, 250);
});
document.addEventListener('paste', e => {          // pegar solo texto plano
  if (!e.target.closest('[data-k]')) return;
  e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text'));
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const i = +b.dataset.i, j = +b.dataset.j;
  ({
    'add-cap': () => S.capitulos.push({ titulo: '', contenido: '', subs: [] }),
    'del-cap': () => S.capitulos.splice(i, 1),
    'add-sub': () => S.capitulos[i].subs.push({ titulo: '', contenido: '' }),
    'del-sub': () => S.capitulos[i].subs.splice(j, 1),
    'add-ref': () => S.referencias.push({ cita: '', categoria: '', tipo: '', uso: '' }),
    'del-ref': () => S.referencias.splice(i, 1),
    'add-anx': () => S.anexos.push({ titulo: '', contenido: '' }),
    'del-anx': () => S.anexos.splice(i, 1)
  })[b.dataset.act]();
  save(); render();
});
$('#btn-print').onclick = () => window.print();
$('#btn-theme').onclick = () => {
  const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue('--bg').trim() === '#17171a';
  r.dataset.theme = dark ? 'light' : 'dark';
};
$('#btn-reset').onclick = () => {
  if (!window.confirm('¿Reiniciar toda la estructura? Se perderá lo escrito.')) return;
  S = blank(); save(); render();
};

  model: () => JSON.parse(JSON.stringify(S)),

render();
</script>
